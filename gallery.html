<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-center">
    <div class="gallery-container">
        <h2>Gallery Project</h2>
        <img width="150" src="qris-qr-code.png" alt="Anggota" onclick="tampilInfoGambar()" style="cursor:pointer">
        
        <iframe width="560" height="315" src="https://www.youtube.com/embed/J4ll9qfRU0g" frameborder="0" allowfullscreen></iframe>
        
        <div>
            <p>Dengarkan Audio:</p>
            <audio id="audioLatar">
                <source src="bahagiaLagi.mp3" type="audio/mpeg">
                Browser kamu tidak mendukung audio.
            </audio>
            <br>
            <button onclick="putarAudio()">Play</button>
            <button onclick="pauseAudio()">Pause</button>
        </div>
    </div>

    <div style="margin-top: 40px;">
        <button onclick="window.location.href='index.html'">Kembali</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
